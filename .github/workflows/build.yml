name: Build

on:
  push:
  pull_request:

jobs:
  helper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper/tailcat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go test ./...
      - run: go build ./...

  fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fabric-26.3, fabric-1.21.1]
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x ./gradlew
      - run: ./gradlew -Ptarget=${{ matrix.target }} :core:test :platform:build
      - uses: actions/upload-artifact@v4
        with:
          name: mewltiplayer-${{ matrix.target }}
          path: targets/${{ matrix.target }}/build/libs/*.jar
