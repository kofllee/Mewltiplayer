def targetProperties = new Properties()
project.file('gradle.properties').withInputStream { targetProperties.load(it) }
targetProperties.each { key, value -> project.ext.set(key.toString(), value.toString()) }

base {
    archivesName = "mewltiplayer-${project.minecraft_version}-neoforge"
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        mewltiplayer {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main {
    java.srcDir rootProject.file('adapters/neoforge/src/main/java')
    java.srcDir rootProject.file("adapters/neoforge/src/versions/${project.minecraft_version}/main/java")
    java.srcDir rootProject.file('adapters/neoforge/src/client/java')
    java.srcDir rootProject.file("adapters/neoforge/src/versions/${project.minecraft_version}/client/java")
    resources.srcDir rootProject.file('adapters/neoforge/src/main/resources')
}

dependencies {
    implementation(project(':core')) {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    if (project.minecraft_version == '1.21.1') {
        additionalRuntimeClasspath(project(':core')) {
            exclude group: 'com.google.code.gson', module: 'gson'
        }
    }
}

tasks.named('processResources') {
    inputs.property('modVersion', project.version)
    inputs.property('minecraftVersion', project.minecraft_version)
    inputs.property('mixinCompatibility', project.java_version)
    inputs.property('iconProperty', project.minecraft_version == '26.3' ? 'iconFile' : 'logoFile')
    filesMatching(['META-INF/neoforge.mods.toml', 'mewltiplayer.client.mixins.json']) {
        expand(version: project.version, minecraft_version: project.minecraft_version,
                mixin_compatibility: project.java_version,
                icon_property: project.minecraft_version == '26.3' ? 'iconFile' : 'logoFile')
    }
    from(rootProject.file('adapters/fabric/src/main/resources')) {
        exclude 'fabric.mod.json', 'mewltiplayer.client.mixins.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version.toString())
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
    withSourcesJar()
}

tasks.named('jar', Jar) {
    from(project(':core').sourceSets.main.output)
}

apply from: rootProject.file('gradle/tailcat-bundle.gradle')